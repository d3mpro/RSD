name: Deploy RSD to Firebase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (rsd-ksu)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RSD_KSU }}
          channelId: live
          projectId: rsd-ksu

      - name: Deploy Firebase Realtime Database Security Rules (rsd-ksu)
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RSD_KSU }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx --yes firebase-tools@latest deploy --only database --project rsd-ksu --non-interactive
          rm -f /tmp/sa.json
